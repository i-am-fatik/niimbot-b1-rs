<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B1 Labels</title>
<meta name="description" content="Print custom labels on a Niimbot B1 over USB or Bluetooth.">
<meta name="theme-color" content="#1d2a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: light;
  --bg: #f4f2ec;
  --panel: #ffffff;
  --ink: #1d2a33;
  --muted: #5d6b75;
  --line: #d9d5ca;
  --accent: #1f6f5c;
  --accent-ink: #ffffff;
  --error: #b3261e;
  --paper: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12181c;
    --panel: #1b2329;
    --ink: #e7ecef;
    --muted: #9aa8b1;
    --line: #2e3a42;
    --accent: #4fb89c;
    --accent-ink: #0d1a16;
    --error: #ff8a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12181c;
  --panel: #1b2329;
  --ink: #e7ecef;
  --muted: #9aa8b1;
  --line: #2e3a42;
  --accent: #4fb89c;
  --accent-ink: #0d1a16;
  --error: #ff8a80;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header, main { max-width: 960px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
h1 { font-size: 1.25rem; margin: 0 auto 0 0; }
button, .button {
  font: inherit;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
#status { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 0.9rem; min-height: 1.3em; }
#status.error { color: var(--error); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 16px; align-items: start; }
@media (max-width: 720px) { main { grid-template-columns: minmax(0, 1fr); } }
.preview, form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.preview { display: grid; justify-items: center; gap: 8px; }
#preview {
  display: block;
  width: 100%;
  max-width: 576px;
  height: auto;
  background: var(--paper);
  image-rendering: pixelated;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgb(0 0 0 / 0.25);
}
#size { margin: 0; color: var(--muted); font-size: 0.85rem; }
form { display: grid; gap: 12px; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
legend { font-weight: 600; margin-bottom: 4px; }
label { display: grid; gap: 4px; font-size: 0.9rem; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select, textarea {
  font: inherit;
  font-size: max(16px, 1rem);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
}
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--accent); }
textarea { resize: vertical; }
.picture { position: relative; display: flex; gap: 8px; }
#add-picture { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); opacity: 0; }
label.button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; color: var(--accent); border-color: var(--accent); }
label.button:hover { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
#add-picture:focus-visible + label.button { outline: 2px solid var(--accent); outline-offset: 2px; }
.layers { display: flex; gap: 8px; }
.layers[hidden] { display: none; }
.layers select { flex: 1; }
.layer-buttons { display: grid; gap: 8px; align-content: start; }
.rotation { display: flex; gap: 8px; align-items: end; }
.rotation label { flex: 1; }
.sheet { position: relative; width: min(100%, 576px, calc(70vh * var(--ratio, 1.6))); }
.guide { position: absolute; background: var(--accent); pointer-events: none; }
.guide.vertical { top: 0; bottom: 0; left: calc(50% - 1px); width: 2px; }
.guide.horizontal { left: 0; right: 0; top: calc(50% - 1px); height: 2px; }
#preview.movable { cursor: grab; touch-action: none; }
#preview.movable:active { cursor: grabbing; }
.hint { display: none; margin: 0; color: var(--muted); font-size: 0.85rem; }
@media (pointer: coarse) {
  .hint { display: block; }
  button, .button, input:not([type="checkbox"]):not([type="file"]), select, label.check { min-height: 44px; }
}
@media (max-width: 720px) {
  .preview { position: sticky; top: 0; z-index: 1; }
  .sheet { width: min(100%, calc(38vh * var(--ratio, 1.6))); }
}
#print { width: 100%; padding: 12px; }
</style>
</head>
<body>
<header>
  <h1>B1 Labels</h1>
  <button id="connect-usb" type="button" disabled>Connect USB</button>
  <button id="connect-bluetooth" type="button" disabled>Connect Bluetooth</button>
  <button id="disconnect" type="button" hidden>Disconnect</button>
  <p id="status" role="status" aria-live="polite"></p>
</header>
<main>
  <section class="preview" aria-label="Print preview">
    <div id="sheet" class="sheet">
      <canvas id="preview" class="movable" width="384" height="240"></canvas>
      <div id="guide-vertical" class="guide vertical" hidden></div>
      <div id="guide-horizontal" class="guide horizontal" hidden></div>
    </div>
    <p id="size"></p>
    <p class="hint">Drag to move, pinch to resize, twist to rotate</p>
  </section>
  <form id="label" autocomplete="off">
    <fieldset>
      <legend>Label</legend>
      <div class="row">
        <label>Width mm <input id="width" type="number" min="10" max="50" value="50" inputmode="numeric"></label>
        <label>Height mm <input id="height" type="number" min="5" max="300" value="30" inputmode="numeric"></label>
      </div>
      <label>Orientation
        <select id="orientation">
          <option value="horizontal">Horizontal</option>
          <option value="vertical">Vertical</option>
        </select>
      </label>
      <label>Text <textarea id="text" rows="3">Hello
B1</textarea></label>
      <div class="row">
        <label>Font size <input id="font-size" type="number" min="6" max="400" value="56" inputmode="numeric"></label>
        <label>Font
          <select id="font">
            <option value="system-ui, sans-serif">Sans</option>
            <option value="Georgia, serif">Serif</option>
            <option value="ui-monospace, Menlo, monospace">Mono</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Align
          <select id="align">
            <option value="left">Left</option>
            <option value="center" selected>Center</option>
            <option value="right">Right</option>
          </select>
        </label>
        <label>Rendering
          <select id="raster">
            <option value="threshold">Sharp</option>
            <option value="dither">Dithered</option>
          </select>
        </label>
      </div>
      <label class="check"><input id="bold" type="checkbox" checked> Bold</label>
      <label class="check"><input id="border" type="checkbox"> Border</label>
      <div class="picture">
        <input id="add-picture" type="file" accept="image/*" multiple>
        <label class="button" for="add-picture"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add images</label>
        <button id="remove-picture" type="button" disabled>Remove</button>
      </div>
      <div id="layers" class="layers" hidden>
        <select id="layer-list" size="4" aria-label="Layers, top first"></select>
        <div class="layer-buttons">
          <button id="raise-layer" type="button" disabled>Move up</button>
          <button id="lower-layer" type="button" disabled>Move down</button>
          <button id="centre-layer" type="button" disabled>Center</button>
        </div>
      </div>
      <label>Image size <input id="picture-size" type="range" min="10" max="400" value="100" disabled></label>
      <div class="rotation">
        <label>Image rotation <input id="picture-rotation" type="range" min="-180" max="180" value="0" disabled></label>
        <button id="turn-picture" type="button" disabled>Rotate 90°</button>
      </div>
      <label>Image darkness <input id="picture-darkness" type="range" min="-10" max="10" value="0" disabled></label>
    </fieldset>
    <fieldset>
      <legend>Print</legend>
      <div class="row">
        <label>Density
          <select id="density">
            <option value="1">1 light</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5 dark</option>
          </select>
        </label>
        <label>Copies <input id="copies" type="number" min="1" max="99" value="1" inputmode="numeric"></label>
      </div>
      <label>Media
        <select id="label-type">
          <option value="1">Gap labels</option>
          <option value="2">Black mark</option>
          <option value="3">Continuous</option>
          <option value="5">Transparent</option>
        </select>
      </label>
      <button id="print" class="primary" type="button" disabled>Print</button>
    </fieldset>
  </form>
</main>
<script type="module">
import init from "./pkg/niimbot_b1_pwa.js";
init();
</script>
</body>
</html>
