name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: the web app as an image any https host can serve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a tag that is not the version it claims
        run: |
          tagged=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "niimbot-b1-pwa") | .version')
          test "$tagged" = "$crate" || {
            echo "the tag says $tagged and niimbot-b1-pwa says $crate"
            exit 1
          }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: an image nobody can push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build it for both architectures and push it under the tag
        run: |
          image=ghcr.io/${{ github.repository_owner }}/niimbot-b1-pwa
          version=${GITHUB_REF_NAME#v}
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "$image:$version" --tag "$image:latest" --push .
